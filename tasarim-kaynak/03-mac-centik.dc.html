<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>MacBook çentiğinde Optik'in kümesi</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#5EE0C8}a:hover{color:#8FEBD9}
button:focus-visible{outline:2px solid #1F6FEB;outline-offset:3px}
.isl{transition:width .45s cubic-bezier(.3,1.25,.5,1),height .45s cubic-bezier(.3,1.25,.5,1),border-radius .45s ease}
.isl-idle{width:312px;height:38px;border-radius:0 0 18px 18px}
.isl-open{width:460px;height:150px;border-radius:0 0 40px 40px}
.isl-answer{width:480px;height:214px;border-radius:0 0 40px 40px}
.coop{transition:transform .45s cubic-bezier(.3,1.25,.5,1)}
.coop-idle{transform:translate(16px,5px) scale(.44)}
.coop-open{transform:translate(24px,80px) scale(1)}
.coop .leaf{transition:transform .35s ease}
.coop-open .leaf{transform:perspective(220px) rotateY(-108deg)}
.opt{transition:transform .5s cubic-bezier(.3,1.5,.5,1),opacity .25s ease}
.opt-in{transform:translate(-50px,30px) scale(.15);opacity:0}
.opt-out{transform:translate(0,0) scale(1);opacity:1;transition-delay:.25s}
.isl-dot{animation:isl-dot 1.8s ease-in-out infinite}
.isl-bar{animation:isl-wave .7s ease-in-out infinite alternate}
.isl-bar.b{animation-delay:.12s}.isl-bar.c{animation-delay:.24s}.isl-bar.d{animation-delay:.36s}.isl-bar.e{animation-delay:.48s}
.isl-type{display:inline-block;max-width:0;white-space:nowrap;overflow:hidden;animation:isl-type 1.3s steps(26) .3s forwards}
.isl-rise{animation:isl-rise .4s ease-out .3s both}
@keyframes isl-dot{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes isl-wave{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
@keyframes isl-type{to{max-width:240px}}
@keyframes isl-rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.tik .eye{width:10px;height:13px;border-radius:5px;background:#FFF4D6;transition:all .28s cubic-bezier(.3,1.5,.5,1)}
.tik .eye-w{animation:tik-blink 4.2s infinite}
.tik .beak{width:10px;height:7px;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:50% 0;transition:transform .28s cubic-bezier(.3,1.5,.5,1)}
.tik-bob{animation:tik-bob 2.8s ease-in-out infinite}
.tik-leg{transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.m-mutlu .eye{height:7px;border-radius:7px 7px 2px 2px}
.m-mutlu .tik-bob{animation:tik-sway 1s ease-in-out infinite}
.m-mutlu .tik-leg-l{animation:tik-step 1s ease-in-out infinite}
.m-mutlu .tik-leg-r{animation:tik-step 1s ease-in-out .5s infinite}
.m-dusunceli .eye{transform:translate(3px,-3px)}
.m-dusunceli .eye.r{height:9px}
.m-dusunceli .tik-bob{animation:tik-tilt 2.6s ease-in-out infinite}
.m-dusunceli .tik-leg-r{animation:tik-toe .6s ease-in-out infinite}
.m-uykulu .eye{width:12px;height:3px;border-radius:2px}
.m-uykulu .eye-w{animation:none}
.m-dinliyor .eye{width:11px;height:14px}
.m-dinliyor .tik-bob{animation:tik-lean 1.8s ease-in-out infinite}
.m-dinliyor .beak{animation:tik-talk .3s ease-in-out infinite alternate}
@keyframes tik-bob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-3px) rotate(1.5deg)}}
@keyframes tik-blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes tik-sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes tik-step{0%,50%,100%{transform:translateY(0)}25%{transform:translateY(-7px)}}
@keyframes tik-tilt{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(4deg)}}
@keyframes tik-toe{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-14deg)}}
@keyframes tik-lean{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(-5deg) translateY(-2px)}}
@keyframes tik-talk{from{transform:scaleY(.6)}to{transform:scaleY(1.8)}}
@media (prefers-reduced-motion: reduce){.tik *,.isl-bar,.isl-dot{animation:none!important;transition:none!important}.isl-type{animation:none!important;max-width:240px}}
</style>
</helmet>
<div style="width: 1280px; height: 600px; box-sizing: border-box; position: relative; overflow: hidden; background: #D8D2C4; color: #F2F0E9; font-family: Inter, system-ui, sans-serif">

<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 1280px; height: 32px; box-sizing: border-box; padding: 0 18px; background: rgba(0,0,0,0.16); display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; align-items: center; gap: 18px">
<div style="width: 16px; height: 16px; border-radius: 5px; background: rgba(0,0,0,0.5)"></div>
<div style="width: 54px; height: 8px; border-radius: 4px; background: rgba(0,0,0,0.5)"></div>
<div style="width: 36px; height: 8px; border-radius: 4px; background: rgba(0,0,0,0.32)"></div>
<div style="width: 44px; height: 8px; border-radius: 4px; background: rgba(0,0,0,0.32)"></div>
<div style="width: 30px; height: 8px; border-radius: 4px; background: rgba(0,0,0,0.32)"></div>
</div>
<div style="font-size: 13px; font-weight: 500; color: #24211C">Pzt 16 Kas 13.08</div>
</div>

<button type="button" class="isl {{islClass}}" aria-label="{{islLabel}}" onClick="{{ play }}" style="position: absolute; left: 50%; top: 0; transform: translateX(-50%); box-sizing: border-box; overflow: hidden; border: none; padding: 0; background: #000000; color: #F2F0E9; cursor: pointer; text-align: left; font-family: Inter, system-ui, sans-serif">
<div aria-hidden="true" style="position: absolute; left: 50%; top: 12px; width: 7px; height: 7px; margin-left: -4px; box-sizing: border-box; border-radius: 50%; background: #17171C; border: 1px solid #2C2C34"></div>
<div class="isl-dot" aria-hidden="true" style="position: absolute; right: 22px; top: 15px; width: 8px; height: 8px; border-radius: 50%; background: #5EE0C8"></div>

<div class="coop {{coopClass}}" aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 48px; height: 58px; transform-origin: 0 0">
<div style="position: absolute; left: 0; top: 0; width: 48px; height: 58px; border-radius: 24px 24px 4px 4px; background: #5A3A1E"></div>
<div style="position: absolute; left: 5px; top: 5px; width: 38px; height: 53px; border-radius: 19px 19px 0 0; background: #1E140B"></div>
<div class="leaf" style="position: absolute; left: 5px; top: 5px; width: 38px; height: 53px; overflow: hidden; border-radius: 19px 19px 0 0; background: #B07A42; transform-origin: 0 50%">
<div style="position: absolute; left: 12px; top: 0; width: 2px; height: 53px; background: rgba(0,0,0,0.2)"></div>
<div style="position: absolute; left: 25px; top: 0; width: 2px; height: 53px; background: rgba(0,0,0,0.2)"></div>
<div style="position: absolute; left: 14px; top: 13px; width: 10px; height: 10px; border-radius: 50%; background: #1E140B"></div>
</div>
<div style="position: absolute; left: -7px; top: 53px; width: 16px; height: 3px; border-radius: 2px; background: #E9C46A; transform: rotate(-18deg)"></div>
<div style="position: absolute; left: 40px; top: 54px; width: 14px; height: 3px; border-radius: 2px; background: #E9C46A; transform: rotate(14deg)"></div>
<div style="position: absolute; left: 45px; top: 49px; width: 10px; height: 3px; border-radius: 2px; background: #E9C46A; transform: rotate(-32deg)"></div>
</div>

<div class="opt {{optClass}}" style="position: absolute; left: 84px; top: 40px; width: 90px; height: 100px; transform-origin: 0 100%">
<div style="position: absolute; left: 0; top: 0; width: 180px; height: 200px; transform: scale(0.5); transform-origin: 0 0">
<div class="tik {{moodClass}}" role="img" aria-label="{{tikAlt}}" style="position: relative; width: 180px; height: 200px">
<div class="tik-bob" style="position: absolute; left: 0; top: 0; width: 180px; height: 160px; transform-origin: 50% 100%">
<div style="position: absolute; left: 30px; top: 6px; width: 120px; height: 156px; border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%; background: #A3957F; clip-path: ellipse(60px 11px at 60px 131px)"></div>
</div>
<svg class="tik-leg tik-leg-l" viewBox="0 0 30 46" aria-hidden="true" style="position: absolute; left: 58px; top: 144px; width: 30px; height: 46px; overflow: visible; transform-origin: 50% 0; fill: none; stroke: {{accent}}; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round"><path d="M15 2V34M15 34L4 43M15 34V44M15 34L26 43"></path></svg>
<svg class="tik-leg tik-leg-r" viewBox="0 0 30 46" aria-hidden="true" style="position: absolute; left: 92px; top: 144px; width: 30px; height: 46px; overflow: visible; transform-origin: 50% 0; fill: none; stroke: {{accent}}; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round"><path d="M15 2V34M15 34L4 43M15 34V44M15 34L26 43"></path></svg>
<div class="tik-bob" style="position: absolute; left: 0; top: 0; width: 180px; height: 160px; transform-origin: 50% 100%">
<div style="position: absolute; left: 30px; top: 6px; width: 120px; height: 156px; border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%; background: #F4EDE0; box-shadow: inset -10px -12px 0 rgba(0,0,0,0.07); clip-path: polygon(0 0, 100% 0, 100% 80%, 90% 87%, 80% 79%, 69% 88%, 58% 80%, 47% 89%, 36% 80%, 25% 88%, 15% 79%, 6% 86%, 0 80%)">
<div style="position: absolute; left: 22px; top: 34px; width: 7px; height: 7px; border-radius: 50%; background: #DDD0BA"></div>
<div style="position: absolute; left: 90px; top: 28px; width: 5px; height: 5px; border-radius: 50%; background: #DDD0BA"></div>
<div style="position: absolute; left: 94px; top: 100px; width: 6px; height: 6px; border-radius: 50%; background: #DDD0BA"></div>
<div style="position: absolute; left: 26px; top: 50px; width: 68px; height: 40px; background: #2A2521; clip-path: polygon(100% 50%, 87.5% 66.7%, 81.2% 87.2%, 58.3% 89.1%, 38.5% 96.1%, 22.4% 81.7%, 3.6% 68.7%, 7.1% 47.7%, 6.3% 27.8%, 25.4% 18.5%, 41.1% 4.4%, 60% 9.7%, 81.2% 11.5%, 88.5% 32%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px">
<div style="display: flex; align-items: center; justify-content: center; gap: 13px; height: 14px">
<div class="eye-w"><div class="eye"></div></div>
<div class="eye-w"><div class="eye r"></div></div>
</div>
<div class="beak" style="background: {{accent}}"></div>
</div>
</div>
</div>
</div>
</div>
</div>

<div style="position: absolute; left: 196px; top: 46px; right: 26px">
<sc-if value="{{ isWake }}" hint-placeholder-val="{{ true }}">
<div class="isl-rise" style="padding-top: 16px; font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 700; font-size: 40px; line-height: 1.1">Efendim?</div>
</sc-if>
<sc-if value="{{ isListen }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 12px; padding-top: 10px">
<div style="display: flex; align-items: center; gap: 10px">
<div aria-hidden="true" style="display: flex; align-items: center; gap: 3px; height: 20px">
<div class="isl-bar" style="width: 4px; height: 12px; border-radius: 2px; background: #5EE0C8"></div>
<div class="isl-bar b" style="width: 4px; height: 20px; border-radius: 2px; background: #5EE0C8"></div>
<div class="isl-bar c" style="width: 4px; height: 16px; border-radius: 2px; background: #5EE0C8"></div>
<div class="isl-bar d" style="width: 4px; height: 20px; border-radius: 2px; background: #5EE0C8"></div>
<div class="isl-bar e" style="width: 4px; height: 10px; border-radius: 2px; background: #5EE0C8"></div>
</div>
<span style="font-size: 13px; font-weight: 600; color: #A3A6B8">Dinliyorum</span>
</div>
<div style="font-size: 16px; font-weight: 500; line-height: 1.3"><span class="isl-type">“Bugün kimle buluşuyorum?”</span></div>
</div>
</sc-if>
<sc-if value="{{ isAnswer }}" hint-placeholder-val="{{ false }}">
<div class="isl-rise" style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 11px; font-weight: 600; color: #A3A6B8">Örnek yanıt</span>
<div style="font-size: 16px; line-height: 1.45; text-wrap: pretty">13.00’te Yeliz ile kahve, Moda’da. 16.30’da da proje grubu toplantın var.</div>
</div>
</sc-if>
</div>
</button>

<div style="position: absolute; left: 0; top: 400px; width: 1280px; display: flex; justify-content: center">
<button type="button" onClick="{{ play }}" style="min-height: 52px; border: none; border-radius: 26px; background: #12131C; color: #F2F0E9; padding: 0 24px; cursor: pointer; display: flex; align-items: center; gap: 12px; font-family: Inter, system-ui, sans-serif; font-size: 15px; font-weight: 600">
<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3"></path></svg>
<span>“Optik!” diye seslen</span>
</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF8A3D","options":["#FF8A3D","#7C9BFF","#F25F8B","#E9C46A"]},"$preview":{"width":1280,"height":600}}'>
class Component extends DCLogic {
  state = { phase: 'wake' };

  componentDidMount() {
    try { if (window.speechSynthesis) window.speechSynthesis.getVoices(); } catch (e) {}
  }

  componentWillUnmount() {
    this.clear();
  }

  clear() {
    (this._ts || []).forEach((t) => clearTimeout(t));
    this._ts = [];
  }

  later(ms, fn) {
    if (!this._ts) this._ts = [];
    this._ts.push(setTimeout(fn, ms));
  }

  sfx(name) {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!this._ac) this._ac = new AC();
      const ac = this._ac;
      if (ac.state === 'suspended') ac.resume();
      const n = (type, f0, f1, at, dur, vol) => {
        const o = ac.createOscillator();
        const g = ac.createGain();
        const t = ac.currentTime + at;
        o.type = type;
        o.frequency.setValueAtTime(f0, t);
        if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g);
        g.connect(ac.destination);
        o.start(t);
        o.stop(t + dur + 0.03);
      };
      const tik = (at) => n('triangle', 1500, 700, at, 0.03, 0.2);
      const civ = (f0, f1, at, dur) => n('sine', f0, f1, at, dur, 0.13);
      if (name === 'nav') { tik(0); }
      else if (name === 'wake') { tik(0); tik(0.09); civ(1800, 3000, 0.2, 0.14); }
      else if (name === 'mutlu') { civ(2200, 3200, 0, 0.07); civ(2600, 3600, 0.11, 0.08); }
    } catch (e) {}
  }

  say(text) {
    try {
      const ss = window.speechSynthesis;
      if (!ss || !window.SpeechSynthesisUtterance) return;
      const voice = ss.getVoices().find((v) => v.lang && v.lang.toLowerCase().indexOf('tr') === 0);
      if (!voice) return;
      const u = new SpeechSynthesisUtterance(text);
      u.voice = voice;
      u.lang = voice.lang;
      u.pitch = 1.7;
      u.rate = 1.05;
      ss.cancel();
      ss.speak(u);
    } catch (e) {}
  }

  play() {
    this.clear();
    this.setState({ phase: 'idle' });
    this.sfx('nav');
    this.later(900, () => {
      this.setState({ phase: 'wake' });
      this.sfx('wake');
      this.later(350, () => this.say('Efendim?'));
    });
    this.later(2900, () => this.setState({ phase: 'listen' }));
    this.later(5800, () => {
      this.setState({ phase: 'answer' });
      this.sfx('mutlu');
    });
    this.later(11500, () => {
      this.setState({ phase: 'idle' });
      this.sfx('nav');
    });
  }

  renderVals() {
    const p = this.state.phase;
    const accent = this.props.accent ?? '#FF8A3D';
    const idle = p === 'idle';
    const moods = { idle: 'm-uykulu', wake: 'm-dinliyor', listen: 'm-dusunceli', answer: 'm-mutlu' };
    const alts = { idle: 'Optik kümesinde', wake: 'Optik, efendim diyor', listen: 'Optik dinliyor', answer: 'Optik yanıtlıyor' };
    return {
      accent: accent,
      islClass: idle ? 'isl-idle' : (p === 'answer' ? 'isl-answer' : 'isl-open'),
      coopClass: idle ? 'coop-idle' : 'coop-open',
      optClass: idle ? 'opt-in' : 'opt-out',
      moodClass: moods[p],
      tikAlt: alts[p],
      islLabel: 'Optik’i çağır',
      isWake: p === 'wake',
      isListen: p === 'listen',
      isAnswer: p === 'answer',
      play: () => this.play()
    };
  }
}
</script>
</body>
</html>
