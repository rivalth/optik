<style>
body{margin:0}
a{color:#5EE0C8}a:hover{color:#8FEBD9}
button:focus-visible{outline:2px solid #5EE0C8;outline-offset:2px}
.tik .eye{width:10px;height:13px;border-radius:5px;background:#FFF4D6;transition:all .28s cubic-bezier(.3,1.5,.5,1)}
.tik .eye-w{animation:tik-blink 4.2s infinite}
.tik .beak{width:10px;height:7px;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:50% 0;transition:transform .28s cubic-bezier(.3,1.5,.5,1)}
.tik .zz,.tik .sp,.tik .al{opacity:0}
.tik-bob{animation:tik-bob 2.8s ease-in-out infinite}
.tik-shadow{animation:tik-shadow 2.8s ease-in-out infinite}
.tik-leg{transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.tik-tap-a{animation:tik-tap-a .55s cubic-bezier(.3,.7,.4,1)}
.tik-tap-b{animation:tik-tap-b .55s cubic-bezier(.3,.7,.4,1)}
.m-mutlu .eye{height:7px;border-radius:7px 7px 2px 2px}
.m-mutlu .tik-bob{animation:tik-sway 1s ease-in-out infinite}
.m-mutlu .tik-leg-l{animation:tik-step 1s ease-in-out infinite}
.m-mutlu .tik-leg-r{animation:tik-step 1s ease-in-out .5s infinite}
.m-dusunceli .eye{transform:translate(3px,-3px)}
.m-dusunceli .eye.r{height:9px}
.m-dusunceli .tik-bob{animation:tik-tilt 2.6s ease-in-out infinite}
.m-dusunceli .tik-leg-r{animation:tik-toe .6s ease-in-out infinite}
.m-uykulu .eye{width:12px;height:3px;border-radius:2px}
.m-uykulu .eye-w{animation:none}
.m-uykulu .tik-bob{animation:tik-sleep 3.6s ease-in-out infinite}
.m-uykulu .tik-leg{transform:scaleY(.3)}
.m-uykulu .zz{animation:tik-zz 2.7s ease-in infinite}
.m-uykulu .zz.b{animation-delay:.9s}
.m-uykulu .zz.c{animation-delay:1.8s}
.m-kutlama .eye{width:11px;height:11px;border-radius:3px;transform:rotate(45deg)}
.m-kutlama .eye-w{animation:tik-twinkle .5s ease-in-out infinite alternate}
.m-kutlama .beak{transform:scaleY(1.5)}
.m-kutlama .tik-act{animation:tik-jump .72s cubic-bezier(.3,.7,.4,1) infinite}
.m-kutlama .tik-shadow{animation:tik-shadow-j .72s cubic-bezier(.3,.7,.4,1) infinite}
.m-kutlama .tik-leg-l{animation:tik-kick-l .72s ease-in-out infinite}
.m-kutlama .tik-leg-r{animation:tik-kick-r .72s ease-in-out infinite}
.m-kutlama .sp{animation:tik-pop .9s ease-out infinite}
.m-kutlama .sp.b{animation-delay:.2s}
.m-kutlama .sp.c{animation-delay:.4s}
.m-kutlama .sp.d{animation-delay:.6s}
.m-uyari .eye{width:12px;height:12px;border-radius:50%}
.m-uyari .beak{transform:scaleY(1.6)}
.m-uyari .tik-act{animation:tik-shake 1.4s ease-in-out infinite}
.m-uyari .tik-leg-l{animation:tik-step .36s ease-in-out infinite}
.m-uyari .tik-leg-r{animation:tik-step .36s ease-in-out .18s infinite}
.m-uyari .al{opacity:1;animation:tik-flash .5s steps(2) infinite}
.m-dinliyor .eye{width:11px;height:14px}
.m-dinliyor .tik-bob{animation:tik-lean 1.8s ease-in-out infinite}
.m-dinliyor .beak{animation:tik-talk .3s ease-in-out infinite alternate}
@keyframes tik-bob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-3px) rotate(1.5deg)}}
@keyframes tik-shadow{0%,100%{transform:scale(1)}50%{transform:scale(.94)}}
@keyframes tik-shadow-j{0%,100%{transform:scale(1);opacity:.4}35%{transform:scale(.66);opacity:.22}60%{transform:scale(.7);opacity:.24}}
@keyframes tik-blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes tik-sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes tik-step{0%,50%,100%{transform:translateY(0)}25%{transform:translateY(-7px)}}
@keyframes tik-tilt{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(4deg)}}
@keyframes tik-toe{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-14deg)}}
@keyframes tik-lean{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(-5deg) translateY(-2px)}}
@keyframes tik-sleep{0%,100%{transform:translateY(36px) scale(1,1)}50%{transform:translateY(37px) scale(1.025,.975)}}
@keyframes tik-zz{0%{opacity:0;transform:translate(0,0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translate(16px,-34px) scale(1.2)}}
@keyframes tik-twinkle{from{transform:scale(.8)}to{transform:scale(1.15)}}
@keyframes tik-jump{0%,100%{transform:translateY(0) scale(1.06,.92)}35%{transform:translateY(-26px) scale(.95,1.07)}60%{transform:translateY(-22px) scale(1,1)}}
@keyframes tik-kick-l{0%,100%{transform:rotate(0deg)}40%{transform:rotate(30deg)}}
@keyframes tik-kick-r{0%,100%{transform:rotate(0deg)}40%{transform:rotate(-30deg)}}
@keyframes tik-pop{0%{opacity:0;transform:scale(.2) rotate(45deg)}30%{opacity:1}100%{opacity:0;transform:scale(1.3) rotate(45deg)}}
@keyframes tik-shake{0%,60%,100%{transform:translateX(0) rotate(0deg)}66%{transform:translateX(-5px) rotate(-3deg)}72%{transform:translateX(5px) rotate(3deg)}78%{transform:translateX(-4px) rotate(-2deg)}84%{transform:translateX(4px) rotate(2deg)}90%{transform:translateX(-2px)}}
@keyframes tik-flash{50%{opacity:.25}}
@keyframes tik-talk{from{transform:scaleY(.6)}to{transform:scaleY(1.8)}}
@keyframes tik-tap-a{0%{transform:scale(1)}25%{transform:scale(1.1,.86)}55%{transform:scale(.94,1.08) translateY(-18px)}80%{transform:scale(1.03,.97)}100%{transform:scale(1)}}

<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF8A3D","options":["#FF8A3D","#7C9BFF","#F25F8B","#E9C46A"]},"$preview":{"width":1180,"height":844}}'>
class Component extends DCLogic {
  state = { mood: 'mutlu', tapN: 0 };

  MOODS = [
    { id: 'mutlu', name: 'Mutlu', when: 'Gün yolunda giderken', sound: 'İki kısa cıvıltı', line: 'Her şey yolunda. Sıradaki işe geçelim mi?' },
    { id: 'dinliyor', name: 'Dinliyor', when: 'Ona dokunduğunda', sound: 'Soran cıvıltı', line: 'Buradayım, dinliyorum.' },
    { id: 'dusunceli', name: 'Düşünceli', when: 'Plan yaparken', sound: 'Alçak mırıltı', line: 'Perşembe dolu. Buluşmayı cumaya alalım mı?' },
    { id: 'uyari', name: 'Hatırlatma', when: 'Yaklaşan bir şey varken', sound: 'Kabuğa tık tık tık', line: 'Ödev teslimine 2 saat kaldı.' },
    { id: 'kutlama', name: 'Kutlama', when: 'Bir işi bitirdiğinde', sound: 'Tırmanan cıvıltılar', line: 'Bitti! Bir tane daha eksildi.' },
    { id: 'uykulu', name: 'Uykulu', when: 'Gün bittiğinde', sound: 'Alçalan esneme', line: 'Bugünlük bu kadar. İyi geceler.' }
  ];

  sfx(name) {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!this._ac) this._ac = new AC();
      const ac = this._ac;
      if (ac.state === 'suspended') ac.resume();
      const n = (type, f0, f1, at, dur, vol) => {
        const o = ac.createOscillator();
        const g = ac.createGain();
        const t = ac.currentTime + at;
        o.type = type;
        o.frequency.setValueAtTime(f0, t);
        if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g);
        g.connect(ac.destination);
        o.start(t);
        o.stop(t + dur + 0.03);
      };
      const tik = (at) => n('triangle', 1500, 700, at, 0.03, 0.2);
      const civ = (f0, f1, at, dur) => n('sine', f0, f1, at, dur, 0.13);
      if (name === 'mutlu') { civ(2200, 3200, 0, 0.07); civ(2600, 3600, 0.11, 0.08); }
      else if (name === 'dinliyor') { civ(1800, 3000, 0, 0.14); }
      else if (name === 'dusunceli') { civ(1400, 1700, 0, 0.16); civ(1700, 1500, 0.18, 0.16); }
      else if (name === 'uyari') { tik(0); tik(0.09); tik(0.18); civ(2400, 2000, 0.3, 0.1); }
      else if (name === 'kutlama') { [2000, 2400, 2800, 3400].forEach((f, i) => civ(f, f * 1.25, i * 0.09, i === 3 ? 0.16 : 0.07)); }
      else if (name === 'uykulu') { n('sine', 1600, 700, 0, 0.6, 0.1); }
    } catch (e) {}
  }

  show(id) {
    this.setState({ mood: id, tapN: this.state.tapN + 1 });
    this.sfx(id);
  }

  renderVals() {
    const s = this.state;
    const accent = this.props.accent ?? '#FF8A3D';
    const current = this.MOODS.find((m) => m.id === s.mood) || this.MOODS[0];
    return {
      accent: accent,
      moodClass: 'm-' + current.id,
      tapClass: s.tapN === 0 ? '' : (s.tapN % 2 ? 'tik-tap-a' : 'tik-tap-b'),
      tikAlt: 'Optik, ' + current.name,
      heroLabel: current.name + ' sesini tekrar çal',
      line: current.line,
      replay: () => this.show(current.id),
      moods: this.MOODS.map((m) => ({
        name: m.name,
        when: m.when,
        sound: m.sound,
        cls: 'm-' + m.id,
        accent: accent,
        pressed: m.id === s.mood ? 'true' : 'false',
        border: m.id === s.mood ? accent : 'transparent',
        pick: () => this.show(m.id)
      }))
    };
  }
}
</script>
</body>
</html>
